_min_copier_version: "9.10.3"
_subdirectory: copier-template
_answers_file: .copier-answers.yml
_envops:
  block_start_string: "<%"
  block_end_string: "%>"
  variable_start_string: "[["
  variable_end_string: "]]"
  keep_trailing_newline: true
_exclude:
  - "*.py[co]"
  - "*.jinja"
  - __pycache__
  - .DS_Store
_skip_if_exists:
  - orinoco.yaml
  - orinoco.lock
  - .orinoco-lite/provenance/**
  - .orinoco-lite/tests/__init__.py
  - .orinoco-lite/tests/browser/**
  - .github/workflows/curation-review.yml
  - metadata/records/**
  - metadata/overlays/annotations/**
  - custom/editorial/**
  - custom/assets/**
  - site/**
  - source-adapters/**
  - extensions/**

project_name:
  type: str
  help: Human-readable project name
  default: Orinoco Lite Site

project_slug:
  type: str
  help: Repository and Pages project-path slug
  default: orinoco-site
  validator: >-
    <% if not (project_slug | regex_search('^[a-z0-9][a-z0-9._-]*$')) %>
    Use lower-case letters, digits, dots, underscores, and hyphens only.
    <% endif %>

site_description:
  type: str
  help: Short public description; this is presentation text, not a license claim
  default: A site built with Orinoco Lite.

repository_slug:
  type: str
  help: GitHub owner/repository used for project Pages
  default: example/orinoco-site
  validator: >-
    <% if not (repository_slug | regex_search('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')) %>
    Use GitHub's owner/repository form.
    <% endif %>

site_base_url:
  type: str
  help: Canonical public base URL, including the project path and trailing slash
  default: https://example.invalid/orinoco-site/

engine_version:
  type: str
  help: Exact orinoco-lite Python distribution version
  default: 0.2.0rc3
  validator: >-
    <% if not (engine_version | regex_search('^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.-]+)?$')) %>
    Use an exact release version such as 0.1.0.
    <% endif %>

engine_url:
  type: str
  help: Immutable orinoco-lite wheel release URL
  default: https://github.com/con/orinoco-lite-dev/releases/download/v0.2.0rc3/orinoco_lite-0.2.0rc3-py3-none-any.whl
  validator: >-
    <% if '#' in engine_url %>
    Supply the wheel URL without a fragment; the template adds the reviewed SHA-256 fragment.
    <% endif %>

engine_sha256:
  type: str
  help: SHA-256 digest of the immutable orinoco-lite wheel
  default: "5224bf90ca441b70012f7297b21b1b8072fe612e9c8984d3682c824118037267"
  validator: >-
    <% if not (engine_sha256 | regex_search('^[0-9a-f]{64}$')) %>
    Supply exactly 64 lower-case hexadecimal characters.
    <% endif %>

runtime_version:
  type: str
  help: Exact immutable Orinoco runtime release version
  default: 0.2.0rc3

runtime_url:
  type: str
  help: Immutable runtime archive URL
  default: https://github.com/con/orinoco-lite-dev/releases/download/v0.2.0rc3/orinoco-runtime-0.2.0rc3.tar.gz

runtime_sha256:
  type: str
  help: SHA-256 digest of the immutable runtime archive
  default: "d25be7a05da33b6b91dc7b3bc1c6b83168f9c54f6bca663cb4a4902e1e7b060a"
  validator: >-
    <% if not (runtime_sha256 | regex_search('^[0-9a-f]{64}$')) %>
    Supply exactly 64 lower-case hexadecimal characters.
    <% endif %>

runtime_manifest_sha256:
  type: str
  help: SHA-256 digest of runtime-manifest.json inside the archive
  default: "839f82029ae0b4805a6d8c53afd88eb18a53023daf13fa5fd09c217dc8f101fd"
  validator: >-
    <% if not (runtime_manifest_sha256 | regex_search('^[0-9a-f]{64}$')) %>
    Supply exactly 64 lower-case hexadecimal characters.
    <% endif %>

template_source:
  type: str
  help: Versioned Copier template source
  default: gh:con/orinoco-lite-template

template_version:
  type: str
  help: Exact Copier template release
  default: v0.2.0rc6
  validator: >-
    <% if not (template_version | regex_search('^v[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.-]+)?$')) %>
    Use an exact release tag such as v0.1.0.
    <% endif %>

workflow_repository:
  type: str
  help: Repository that publishes the reviewed Orinoco release
  default: con/orinoco-lite-dev

workflow_sha:
  type: str
  help: Full reviewed commit SHA associated with the release workflows
  default: "8bd328b17e359bf9594e83381c3efc1c7ab0ecac"
  validator: >-
    <% if not (workflow_sha | regex_search('^[0-9a-f]{40}$')) %>
    Supply exactly 40 lower-case hexadecimal characters.
    <% endif %>

workflow_ref:
  type: str
  help: Full immutable reusable-workflow reference, including path and commit SHA
  default: con/orinoco-lite-dev/.github/workflows/orinoco-consumer-ci.yml@8bd328b17e359bf9594e83381c3efc1c7ab0ecac
  validator: >-
    <% if not (workflow_ref | regex_search('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml@[0-9a-f]{40}$')) %>
    Use owner/repository/.github/workflows/name.yml@ followed by a full commit SHA.
    <% endif %>
