_min_copier_version: "9.10.3"
_subdirectory: copier-template
_answers_file: .copier-answers.yml
_envops:
  block_start_string: "<%"
  block_end_string: "%>"
  variable_start_string: "[["
  variable_end_string: "]]"
  keep_trailing_newline: true
_exclude:
  - "*.py[co]"
  - "*.jinja"
  - __pycache__
  - .DS_Store
  - "<% if not include_site_specific -%>site-specific<% endif %>"
  # Starter inputs and empty-directory sentinels belong only to a new site.
  - "<% if _copier_operation == 'update' -%>extensions/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/assets/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/content/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/metadata/records/site-root.yaml<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/metadata/records/starter-person.yaml<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/metadata/records/starter-project.yaml<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/metadata/records/starter-publication.yaml<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/overrides/config/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/overrides/layouts/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/overrides/static/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/static/.gitkeep<% endif %>"
_skip_if_exists:
  - orinoco.yaml
  - .github/workflows/curation-review.yml
  - site-specific/**
  - extensions/**

project_slug:
  type: str
  help: Repository and Pages project-path slug
  default: orinoco-site
  validator: >-
    <% if not (project_slug | regex_search('^[a-z0-9][a-z0-9._-]*$')) %>
    Use lower-case letters, digits, dots, underscores, and hyphens only.
    <% endif %>

project_name:
  type: str
  help: Human-readable site title
  default: Orinoco Lite Site

site_description:
  type: str
  help: Short public description; this is display text, not a license claim
  default: A site built with Orinoco Lite.

site_base_url:
  type: str
  help: Canonical public base URL, including any project path and trailing slash
  default: https://example.invalid/[[ project_slug ]]/

include_site_specific:
  type: bool
  help: Include starter site-specific inputs (disable to supply your own tree)
  default: true
  when: false

pr_previews:
  type: str
  help: Pull-request preview deployments for this site
  default: none
  choices:
    No pull-request previews: none
    Netlify deploy previews: netlify


package_repository:
  type: str
  help: Git repository containing the Orinoco Lite Python project
  default: https://github.com/ORINOCO-Lite/orinoco-lite-dev.git
  when: false

package_revision:
  type: str
  help: Release tag or exact Git commit to install
  default: "2dbe0723437c2f0e10b8a7f4316f3312ad0733a3"
  when: false
  validator: >-
    <% if not package_revision %>
    Supply a release tag or exact Git commit.
    <% endif %>

pages_history_limit:
  type: int
  help: Maximum successful publications retained on gh-pages
  default: "[[ pages_history_limit | default(3) ]]"
  when: false
  validator: >-
    <% if pages_history_limit < 1 %>
    Retain at least one publication.
    <% endif %>
