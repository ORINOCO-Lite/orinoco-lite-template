_min_copier_version: "9.10.3"
_subdirectory: copier-template
_answers_file: .copier-answers.yml
_envops:
  block_start_string: "<%"
  block_end_string: "%>"
  variable_start_string: "[["
  variable_end_string: "]]"
  keep_trailing_newline: true
_exclude:
  - "*.py[co]"
  - "*.jinja"
  - __pycache__
  - .DS_Store
  - "<% if not include_site_specific -%>site-specific<% endif %>"
  # Starter inputs and empty-directory sentinels belong only to a new site.
  - "<% if _copier_operation == 'update' -%>extensions/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/assets/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/content/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/metadata/records/site-root.yaml<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/metadata/records/starter-person.yaml<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/metadata/records/starter-project.yaml<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/metadata/records/starter-publication.yaml<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/overrides/config/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/overrides/layouts/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/overrides/static/.gitkeep<% endif %>"
  - "<% if _copier_operation == 'update' -%>site-specific/static/.gitkeep<% endif %>"
_skip_if_exists:
  - orinoco.yaml
  - orinoco.lock
  - .github/workflows/curation-review.yml
  - site-specific/**
  - extensions/**

project_slug:
  type: str
  help: Repository and Pages project-path slug
  default: orinoco-site
  validator: >-
    <% if not (project_slug | regex_search('^[a-z0-9][a-z0-9._-]*$')) %>
    Use lower-case letters, digits, dots, underscores, and hyphens only.
    <% endif %>

project_name:
  type: str
  help: Human-readable site title
  default: Orinoco Lite Site

site_description:
  type: str
  help: Short public description; this is presentation text, not a license claim
  default: A site built with Orinoco Lite.

site_base_url:
  type: str
  help: Canonical public base URL, including any project path and trailing slash
  default: https://example.invalid/[[ project_slug ]]/

include_site_specific:
  type: bool
  help: Include starter site-specific inputs (disable to supply your own tree)
  default: true

pr_previews:
  type: str
  help: Pull-request preview deployments for this site
  default: none
  choices:
    No pull-request previews: none
    Netlify deploy previews: netlify

package_version:
  type: str
  help: Exact orinoco-lite Python distribution version
  default: 0.3.0rc5
  when: false
  validator: >-
    <% if not (package_version | regex_search('^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.-]+)?$')) %>
    Use an exact release version such as 0.1.0.
    <% endif %>

package_url:
  type: str
  help: Immutable orinoco-lite wheel release URL
  default: https://github.com/ORINOCO-Lite/orinoco-lite-dev/releases/download/v0.3.0rc5/orinoco_lite-0.3.0rc5-py3-none-any.whl
  when: false
  validator: >-
    <% if '#' in package_url %>
    Supply the wheel URL without a fragment; the template adds the reviewed SHA-256 fragment.
    <% endif %>

package_sha256:
  type: str
  help: SHA-256 digest of the immutable orinoco-lite wheel
  default: "55f67bd3dcc1e5d1f94d40436721913d52eb22ab918cb5c36a528db6853d3b0e"
  when: false
  validator: >-
    <% if not (package_sha256 | regex_search('^[0-9a-f]{64}$')) %>
    Supply exactly 64 lower-case hexadecimal characters.
    <% endif %>

template_source:
  type: str
  help: Versioned Copier template source
  default: gh:ORINOCO-Lite/orinoco-lite-template
  when: false

template_version:
  type: str
  help: Exact Copier template release
  default: v0.3.0rc3
  when: false
  validator: >-
    <% if not (template_version | regex_search('^v[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.-]+)?$')) %>
    Use an exact release tag such as v0.1.0.
    <% endif %>

workflow_repository:
  type: str
  help: Repository that publishes the reviewed Orinoco release
  default: ORINOCO-Lite/orinoco-lite-dev
  when: false

workflow_sha:
  type: str
  help: Full reviewed commit SHA associated with the release workflows
  default: "41d349ed2680d89044596800e3af6b6f7e133b72"
  when: false
  validator: >-
    <% if not (workflow_sha | regex_search('^[0-9a-f]{40}$')) %>
    Supply exactly 40 lower-case hexadecimal characters.
    <% endif %>

workflow_ref:
  type: str
  help: Full immutable reusable-workflow reference, including path and commit SHA
  default: ORINOCO-Lite/orinoco-lite-dev/.github/workflows/orinoco-consumer-ci.yml@41d349ed2680d89044596800e3af6b6f7e133b72
  when: false
  validator: >-
    <% if not (workflow_ref | regex_search('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml@[0-9a-f]{40}$')) %>
    Use owner/repository/.github/workflows/name.yml@ followed by a full commit SHA.
    <% endif %>
