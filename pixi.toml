[workspace]
name = "orinoco-lite-template"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]

[dependencies]
python = ">=3.12,<3.13"
copier = "==9.10.3"
pyyaml = "==6.0.2"

[tasks]
render = "python tools/render_template.py --replace"
test = "python -m unittest discover -s tests -p 'test_*.py'"
render-sample-site = "python tools/render_template.py --replace --destination build/sample-site --data-file tests/sample-site/answers.yml"
build-sample-site = { depends-on = ["render-sample-site"], cmd = "rm -f build/sample-site/site-specific/metadata/records/.gitkeep && cp tests/sample-site/records/*.yaml build/sample-site/site-specific/metadata/records/ && cp tests/sample-site/content/*.md build/sample-site/site-specific/content/ && pixi run --frozen --manifest-path build/sample-site/pixi.toml verify-build" }
check = { depends-on = ["test"] }
