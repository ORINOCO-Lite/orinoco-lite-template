[workspace]
requires-pixi = ">=0.76"
name = "orinoco-lite-template"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]

[dependencies]
python = ">=3.12,<3.13"
copier = "==9.10.3"
pyyaml = "==6.0.2"
pytest = ">=9,<10"

[tasks]
render = "python tools/render_template.py --replace"
