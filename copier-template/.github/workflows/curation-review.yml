name: Curate source metadata

on:
  workflow_dispatch:
    inputs:
      adapter:
        description: Trusted adapter under extensions/source-adapters
        required: true
        type: string
  issue_comment:
    types: [created]

permissions: {}

jobs:
  curate:
    if: >-
      github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '/curation submit')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    concurrency:
      group: curation-${{ github.event.issue.number || inputs.adapter }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the trusted locked environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          frozen: true
          cache: true

      # The App grants repository write access only after this step succeeds.
      - name: Validate and record the composed adapter result
        env:
          GH_TOKEN: ${{ github.token }}
        run: pixi run orinoco-lite curation validate

      - name: Publish validated changes
        id: publish
        run: pixi run orinoco-lite curation publish

      - name: Upload review presentation
        if: steps.publish.outputs.review_artifact != ''
        id: review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.publish.outputs.review_artifact }}
          path: build/curation/artifact/review-bundle.json
          retention-days: 14
          if-no-files-found: error

      - name: Complete review and release temporary access
        if: always()
        env:
          CURATION_REVIEW_TOKEN: ${{ steps.publish.outputs.review_token }}
          REVIEW_ARTIFACT_ID: ${{ steps.review.outputs.artifact-id }}
        run: pixi run orinoco-lite curation complete --artifact-id "$REVIEW_ARTIFACT_ID"
