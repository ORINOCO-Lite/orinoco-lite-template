name: Curate source metadata

on:
  workflow_dispatch:
    inputs:
      adapter:
        description: Trusted adapter under extensions/source-adapters
        required: true
        type: string
  issue_comment:
    types: [created]

permissions: {}

jobs:
  curate:
    if: >-
      github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '/curation submit')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    concurrency:
      group: curation-${{ github.event.issue.number || inputs.adapter }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the trusted locked environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          frozen: true
          cache: true

      - name: Resolve authenticated proposal coordinates
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTER: ${{ inputs.adapter }}
        run: pixi run python -m orinoco_lite.curation_actions prepare

      - name: Obtain metadata read access from the existing App
        id: read
        env:
          PROPOSAL_NUMBER: ${{ steps.proposal.outputs.number }}
          PROPOSAL_HEAD: ${{ steps.proposal.outputs.head }}
          CURATION_COMMENT_ID: ${{ steps.proposal.outputs.comment_id }}
        run: pixi run python -m orinoco_lite.workflow_access --curation

      - name: Check out exact website and metadata states as data
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_TOKEN: ${{ steps.read.outputs.token }}
          METADATA_REPOSITORY: ${{ steps.read.outputs.repository }}
          METADATA_HEAD: ${{ steps.read.outputs.head }}
        run: pixi run python -m orinoco_lite.curation_actions checkout

      - name: Validate and record the composed adapter result
        id: record
        run: pixi run python -m orinoco_lite.curation_actions record

      - name: Obtain metadata write access after validation
        if: steps.record.outputs.has_changes == 'true'
        id: write
        env:
          PROPOSAL_NUMBER: ${{ steps.proposal.outputs.number }}
          PROPOSAL_HEAD: ${{ steps.proposal.outputs.head }}
          CURATION_COMMENT_ID: ${{ steps.proposal.outputs.comment_id }}
        run: pixi run python -m orinoco_lite.workflow_access --curation --write

      - name: Publish both drafts with exact-head leases
        if: steps.record.outputs.has_changes == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_TOKEN: ${{ steps.write.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: pixi run python -m orinoco_lite.curation_actions publish

      - name: Render proposal presentation
        if: github.event_name == 'workflow_dispatch' && steps.record.outputs.has_changes == 'true'
        run: pixi run python -m orinoco_lite.curation_actions bundle

      - name: Publish expiring review presentation
        if: github.event_name == 'workflow_dispatch' && steps.record.outputs.has_changes == 'true'
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orinoco-curation-review-${{ steps.publish.outputs.proposal }}
          path: build/curation/artifact/review-bundle.json
          retention-days: 14
          if-no-files-found: error

      - name: Report review link or completed decisions
        if: steps.record.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: pixi run python -m orinoco_lite.curation_actions announce

      - name: Revoke metadata access
        if: always()
        env:
          READ_TOKEN: ${{ steps.read.outputs.token }}
          WRITE_TOKEN: ${{ steps.write.outputs.token }}
        run: |
          for token in "$READ_TOKEN" "$WRITE_TOKEN"; do
            if [[ -n "$token" ]]; then
              GH_TOKEN="$token" gh api --method DELETE installation/token
            fi
          done
