name: Update downstream template

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Template version
        type: choice
        default: Latest release
        options:
          - Latest release
          - main
          - Specific commit
      revision:
        description: Full commit hash (only for Specific commit)
        type: string
      package_revision:
        description: Optional package override (otherwise use the template selection)
        type: string
      package_repository:
        description: Optional package repository override
        type: string
      environment_revision:
        description: Optional known-good commit or branch to run the updater (for conflict recovery)
        type: string

permissions:
  contents: read

concurrency:
  group: template-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Prepare template update
    outputs:
      changed: ${{ steps.bundle.outputs.changed }}
      conflicts: ${{ steps.update.outputs.conflicts }}
      validation: ${{ steps.validate.outcome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install Pixi for environment selection
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          run-install: false
          cache: false
      - name: Prepare the updater environment
        env:
          ENVIRONMENT_REVISION: ${{ inputs.environment_revision || github.sha }}
        run: |
          revision=$(git rev-parse --verify --end-of-options "$ENVIRONMENT_REVISION^{commit}" || git rev-parse --verify --end-of-options "origin/$ENVIRONMENT_REVISION^{commit}")
          mkdir -p "$RUNNER_TEMP/orinoco-update"
          git archive "$revision" pixi.toml | tar -x -C "$RUNNER_TEMP/orinoco-update"
          development=.orinoco-lite/orinoco-lite-dev
          if git cat-file -e "$revision:$development" 2>/dev/null; then
            package_commit=$(git rev-parse "$revision:$development")
            package_repository=$(git config --blob "$revision:.gitmodules" --get "submodule.$development.url")
            pixi add --manifest-path "$RUNNER_TEMP/orinoco-update/pixi.toml" --no-install \
              --pypi orinoco-lite --git "$package_repository" --rev "$package_commit"
          fi
          echo "ORINOCO_UPDATE_ENVIRONMENT=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$revision" >> "$GITHUB_ENV"
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          activate-environment: true
          locked: false
          cache: false
          manifest-path: ${{ runner.temp }}/orinoco-update/pixi.toml
      - name: Configure update commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Record template update
        id: update
        env:
          TEMPLATE_SELECTION: ${{ inputs.selection }}
          TEMPLATE_REVISION: ${{ inputs.revision }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          PACKAGE_REPOSITORY: ${{ inputs.package_repository }}
        run: |
          case "$TEMPLATE_SELECTION" in
            'Latest release') revision=latest ;;
            main) revision=main ;;
            'Specific commit')
              [[ "$TEMPLATE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Supply a full commit hash.'; exit 2; }
              revision=$TEMPLATE_REVISION ;;
            *) echo 'Choose a template version.'; exit 2 ;;
          esac
          args=(--revision "$revision")
          if [[ -n "$PACKAGE_REVISION" ]]; then args+=(--package-revision "$PACKAGE_REVISION"); fi
          if [[ -n "$PACKAGE_REPOSITORY" ]]; then args+=(--package-repository "$PACKAGE_REPOSITORY"); fi
          status=0
          pixi run --manifest-path "$RUNNER_TEMP/orinoco-update/pixi.toml" orinoco-lite --root "$GITHUB_WORKSPACE" template update "${args[@]}" || status=$?
          if [[ "$status" -gt 1 ]]; then exit "$status"; fi
          echo "conflicts=$status" >> "$GITHUB_OUTPUT"
      - name: Validate in the selected environment
        id: validate
        if: steps.update.outputs.conflicts == '0'
        continue-on-error: true
        run: |
          pixi run --manifest-path "$GITHUB_WORKSPACE/pixi.toml" build
          pixi run --manifest-path "$GITHUB_WORKSPACE/pixi.toml" orinoco-lite verify-site build/site
      - name: Export recorded update
        id: bundle
        run: |
          if [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The selected template is already applied.' >> "$GITHUB_STEP_SUMMARY"
          else
            git branch orinoco-template-result HEAD
            git bundle create "$RUNNER_TEMP/template-update.bundle" orinoco-template-result "^$GITHUB_SHA"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.bundle.outputs.changed == 'true'
        with:
          name: template-update
          path: ${{ runner.temp }}/template-update.bundle
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish template update
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Pixi for environment selection
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          run-install: false
          cache: false
      - name: Preserve the trusted publishing environment
        run: |
          mkdir -p "$RUNNER_TEMP/orinoco-publish"
          git archive "$GITHUB_SHA" pixi.toml | tar -x -C "$RUNNER_TEMP/orinoco-publish"
          development=.orinoco-lite/orinoco-lite-dev
          if git cat-file -e "$GITHUB_SHA:$development" 2>/dev/null; then
            package_commit=$(git rev-parse "$GITHUB_SHA:$development")
            package_repository=$(git config --blob "$GITHUB_SHA:.gitmodules" --get "submodule.$development.url")
            pixi add --manifest-path "$RUNNER_TEMP/orinoco-publish/pixi.toml" --no-install \
              --pypi orinoco-lite --git "$package_repository" --rev "$package_commit"
          fi
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          activate-environment: true
          locked: false
          cache: false
          manifest-path: ${{ runner.temp }}/orinoco-publish/pixi.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: template-update
          path: ${{ runner.temp }}/template-update
      - name: Obtain curation App access
        id: access
        run: pixi run --manifest-path "$RUNNER_TEMP/orinoco-publish/pixi.toml" python -m orinoco_lite.workflow_access --template
      - name: Import recorded commits without executing updated code
        run: |
          git bundle verify "$RUNNER_TEMP/template-update/template-update.bundle"
          git fetch "$RUNNER_TEMP/template-update/template-update.bundle" refs/heads/orinoco-template-result
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
      - name: Open update draft pull request
        id: pull
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.access.outputs.token }}
          base: ${{ github.ref_name }}
          branch: automation/template-update-${{ github.run_id }}
          title: 'chore: update downstream template'
          draft: true
          body: |
            Automated template update recorded with DataLad by the Orinoco Lite CLI.

            Conflict status: ${{ needs.update.outputs.conflicts }} (0 = none, 1 = resolve conflicts).
            Validation: ${{ needs.update.outputs.validation }}.
            [Execution and validation logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Review the commits and resolve any conflict markers by editing the files
            in this branch. Validation must pass before merging. See
            `docs/template-updates.md` for browser editing and rollback.
      - name: Report update result
        env:
          PULL_URL: ${{ steps.pull.outputs.pull-request-url }}
          CONFLICTS: ${{ needs.update.outputs.conflicts }}
          VALIDATION: ${{ needs.update.outputs.validation }}
        run: |
          if [[ -z "$PULL_URL" ]]; then
            echo '::error::The recorded update did not produce a pull request.'
            exit 1
          fi
          echo "[Review the template update]($PULL_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Conflict status: $CONFLICTS. Validation: $VALIDATION." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CONFLICTS" == 1 || "$VALIDATION" == failure ]]; then
            echo '::error::The draft update needs conflict resolution or a validation fix.'
            exit 1
          fi
      - name: Revoke temporary App access
        if: always() && steps.access.outputs.token != ''
        env:
          UPDATE_TOKEN: ${{ steps.access.outputs.token }}
        run: pixi run --manifest-path "$RUNNER_TEMP/orinoco-publish/pixi.toml" python -c 'import os; from orinoco_lite.workflow_access import revoke; revoke(os.environ["UPDATE_TOKEN"])'
