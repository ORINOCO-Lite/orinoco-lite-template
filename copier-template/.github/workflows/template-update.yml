name: Update downstream template

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Template commit, tag, or branch
        required: true
        type: string
      package_revision:
        description: Optional package override (otherwise use the template selection)
        type: string
      package_repository:
        description: Optional package repository override
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  PIXI_LOCKED: "true"

concurrency:
  group: template-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          locked: true
      - name: Configure update commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Record template update
        id: update
        env:
          TEMPLATE_REVISION: ${{ inputs.revision }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          PACKAGE_REPOSITORY: ${{ inputs.package_repository }}
        run: |
          args=(--revision "$TEMPLATE_REVISION")
          if [[ -n "$PACKAGE_REVISION" ]]; then args+=(--package-revision "$PACKAGE_REVISION"); fi
          if [[ -n "$PACKAGE_REPOSITORY" ]]; then args+=(--package-repository "$PACKAGE_REPOSITORY"); fi
          status=0
          pixi run orinoco-lite template update "${args[@]}" || status=$?
          if [[ "$status" -gt 1 ]]; then exit "$status"; fi
          echo "conflicts=$status" >> "$GITHUB_OUTPUT"
      - name: Validate in the selected environment
        id: validate
        if: steps.update.outputs.conflicts == '0'
        continue-on-error: true
        run: |
          pixi run build
          pixi run orinoco-lite verify-site build/site
      - name: Open update draft pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.ORINOCO_UPDATE_TOKEN || github.token }}
          branch: automation/template-update-${{ github.run_id }}
          title: 'chore: update downstream template'
          draft: true
          body: |
            **AI-generated draft — not reviewed by John**

            Template update recorded with DataLad by the Orinoco Lite CLI.

            Conflict status: ${{ steps.update.outputs.conflicts }} (0 = none, 1 = resolve conflicts).
            Validation: ${{ steps.validate.outcome }}.
            [Execution and validation logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Review the commits and resolve any conflict markers by editing the files
            in this branch. Validation must pass before merging. See
            `docs/template-updates.md` for browser editing and rollback.
