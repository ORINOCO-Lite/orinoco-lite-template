contract_version: 2

classes:
  template_owned:
    behavior: materialized-template
    paths:
      - README.md
      - .gitignore
      - .copier-answers.yml
      - pixi.toml
      - .agents/**
      - .orinoco-lite/README.md
      - .orinoco-lite/template-ownership.yml
      - .orinoco-lite/site/**
      - .orinoco-lite/tools/**
      - .orinoco-lite/tests/**
      - .github/workflows/**
      - docs/**
  site_specific:
    behavior: site-owned-input
    paths:
      - orinoco.yaml
      - site-specific/**
      - .orinoco-lite/provenance/**
  extensions:
    behavior: site-owned-stable-hook
    paths:
      - extensions/**
  release_lock:
    behavior: exact-version-selection
    paths:
      - orinoco.lock
      - pixi.lock
  site_policy:
    behavior: site-owned-policy
    paths:
      - LICENSE*
      - CITATION*
      - CONTRIBUTING*
      - CODE_OF_CONDUCT*
  generated:
    behavior: ignored-runtime-output
    paths:
      - generated/**
      - build/**
