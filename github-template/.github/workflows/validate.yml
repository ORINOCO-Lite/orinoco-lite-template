name: Validate downstream site

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope
        required: true
        default: full
        type: choice
        options:
          - full
          - joined

permissions:
  contents: read

jobs:
  macos:
    name: Validate (macOS 14 ARM64)
    if: >-
      github.repository != 'ORINOCO-Lite/orinoco-lite-template' &&
      ((github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.head.ref, 'automation/curation/')) ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_dispatch' && inputs.validation == 'full'))
    uses: ORINOCO-Lite/orinoco-lite-dev/.github/workflows/orinoco-consumer-ci.yml@9807d0ec842d757d0b6617445bdb5004f24b5c6e
    with:
      command: test-all
      pixi-version: v0.73.0
      runner: macos-14
  linux:
    name: Validate (Linux x86-64)
    if: >-
      github.repository != 'ORINOCO-Lite/orinoco-lite-template' &&
      ((github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.head.ref, 'automation/curation/')) ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_dispatch' && inputs.validation == 'full'))
    uses: ORINOCO-Lite/orinoco-lite-dev/.github/workflows/orinoco-consumer-ci.yml@9807d0ec842d757d0b6617445bdb5004f24b5c6e
    with:
      command: test-all
      pixi-version: v0.73.0
      runner: ubuntu-24.04
      artifact-name: static-site-${{ github.sha }}
      artifact-path: build/site
  linux-joined:
    name: Validate joined graph (Linux x86-64)
    if: >-
      github.repository != 'ORINOCO-Lite/orinoco-lite-template' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.validation == 'joined'
    uses: ORINOCO-Lite/orinoco-lite-dev/.github/workflows/orinoco-consumer-ci.yml@9807d0ec842d757d0b6617445bdb5004f24b5c6e
    with:
      command: validate
      pixi-version: v0.73.0
      runner: ubuntu-24.04
