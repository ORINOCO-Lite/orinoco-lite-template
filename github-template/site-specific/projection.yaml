version: 2

routing:
  strip_prefix: "xyzrins:"

homepage:
  pid: xyzrins:.
  template: .orinoco-lite/site/projection-templates/homepage.md.j2
  reverse_injections:
    - from: generated_by
      to: generated
    - from: part_of
      to: parts
  inline:
    - associated_with
    - associated_with::roles
    - influenced_by
    - influenced_by::roles
    - identifiers::creator
    - part_of

pages:
  xyzri:XYZDataset:
    template: .orinoco-lite/site/projection-templates/dataset.md.j2
    inline: [about, attributed_to, kind, rules, characterized_by]
  xyzri:XYZInstrument:
    template: .orinoco-lite/site/projection-templates/instrument.md.j2
    inline: [about, attributed_to, kind, rules]
  xyzri:XYZObjective:
    template: .orinoco-lite/site/projection-templates/objective.md.j2
    inline: [part_of, depends_on]
  xyzri:XYZPerson:
    template: .orinoco-lite/site/projection-templates/person.md.j2
    inline: [delegated_by, delegated_by::roles, identifiers::creator]
  xyzri:XYZProject:
    template: .orinoco-lite/site/projection-templates/project.md.j2
    reverse_injections:
      - from: generated_by
        to: generated
      - from: part_of
        to: parts
    inline:
      - associated_with
      - associated_with::roles
      - influenced_by
      - influenced_by::roles
      - identifiers::creator
      - part_of
  xyzri:XYZPublication:
    template: .orinoco-lite/site/projection-templates/publication.md.j2
    inline: [about, attributed_to]
  xyzri:XYZTopic:
    template: .orinoco-lite/site/projection-templates/topic.md.j2
    inline: [part_of]

unrendered_classes:
  - xyzri:XYZAgentRole
  - xyzri:XYZBibliographicType
  - xyzri:XYZGrant
  - xyzri:XYZInstrumentType
  - xyzri:XYZOrganization
  - xyzri:XYZPublicationVenue

graph:
  producer: .orinoco-lite/site/projection-tools/pool2graph.py
  node_classes:
    - xyzri:XYZDataset
    - xyzri:XYZInstrument
    - xyzri:XYZObjective
    - xyzri:XYZOrganization
    - xyzri:XYZPerson
    - xyzri:XYZProject
    - xyzri:XYZPublication
    - xyzri:XYZTopic
  relationship_fields:
    - about
    - associated_with
    - attributed_to
    - delegated_by
    - generated_by
    - influenced_by
    - part_of
  missing_external_targets: reject
