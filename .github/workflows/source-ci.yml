name: Validate Copier source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    name: Source check (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS 14 ARM64
            runner: macos-14
          - label: Linux x86-64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the Copier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the locked source environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
          pixi-version: v0.73.0
      - name: Check source, render, ownership, and update proofs
        run: pixi run check
